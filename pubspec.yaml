name: wafferly
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.10

  # Charts
  fl_chart: ^0.68.0
  reorderables: ^0.6.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  uuid: ^4.5.1

  # State Management & Utilities
  provider: ^6.1.1
  image_picker: ^1.1.2
  vector_graphics: ^1.1.11

  math_expressions: ^2.6.0

  shared_preferences: ^2.2.3

  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  hive_generator: ^2.0.1
  build_runner: ^2.4.6   # ✅ تم توحيد الإصدار، وإزالة السطر المكرر

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/categories/
    - assets/icons/ui/
    - assets/avatars/
    - assets/sounds/